<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CSS 
    * inheritance
    * specificity
    * cascading 
    -->
</head>

<style>
    .gp {
        color: red;
      
    }

    .parent {
        color:blue;
        
    }

    .child {
        color:green;
    }

</style>

<body>
    <div class="gp">
        <div class="parent">
            <div class="child">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ut explicabo corrupti,
                asperiores natus quia nostrum! Tempora, asperiores, minus enim vel, nemo doloribus sed ad aliquid quia
                quo quidem doloremque consequuntur.</div>
        </div>
    </div>

</body>

</html>



<!-- 
direct styling > inherited styling

-->
