<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
       height: 100px;
       width: 100px;
       border: 2px solid red; 
    }
</style>
<body>
    
     <div></div>
     <!-- when button is clicked then change div bg to blue 
     element
     event 
     function 
     -->
     <button>Change Bg to blue</button>
     <script>
     let button= document.querySelector("button");
     button.addEventListener("click",
     function(){
        // select the element
        let box=document.querySelector("div");
        // do the action
        box.style.backgroundColor="blue";
     })
     </script>
</body>
</html>
