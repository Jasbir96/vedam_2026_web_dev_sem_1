<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #imp{
            color: red;
        }
    </style>
</head>

<body>
    <!-- block level elemnts : that take full width of 
     html page even if if there is some space left
     * heading -> h1-h6
     * li 
     * p
    -->
    <h1>I am heading-1</h1>
    <h1>I am heading-2</h1>
    <!-- inline elements: they take only the required space
 * anchor
 * span
-->
    <a href="">I am link-1</a>
    <a href="">I am link-2</a>

    <!-- Paragraph -->
    <p>I am a sentence-1</p>
    <p>I am a sentence-2</p>
    
    <span>I am a span sentence-1 </span>
    <span>I am a span sentence-2 </span>

    <p>Hello this is an <span id="imp">important</span> quote</p>
</body>

</html>
