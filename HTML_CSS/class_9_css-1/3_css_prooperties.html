<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first {
            color: wheat;
        }
        .hexa {
            color: #2776F5;
        }
        .rgb {
            color: rgb(231, 245, 39);
        }
        .rgb-opacity {
            color: rgba(231, 245, 39, 0.5);
        }
        p {
            /* size of the element */
            font-size: 20px;
            /* control boldness */
            font-weight: 100;
            /* italic */
            font-style: italic;
            background-color: lightblue;
            /* underline */
            text-decoration: underline;
            /* 1. 'Courier New'
   2.   Courier
   3. monospace
*/
            font-family: 'Segoe UI', Tahoma, Geneva, 
            Verdana, sans-serif;
            text-transform: lowercase;
            /* text-decoration: line-through; */
        }
        .strike {
            text-decoration: line-through;
            text-align: right;
        }
    </style>

</head>

<body>
    <div>
        <h1>Css properties- colors</h1>
        <h2 class="first">I am normal colour</h2>
        <h2 class="hexa">I am hexa</h2>
        <h2 class="rgb">I am rgb</h2>
        <h2 class="rgb-opacity"> I am rgb with opacity </h2>
    </div>

    <h1> Css properties - text and Font</h1>

    <p>Lorem ipsum dolor sit amet.</p>
    <p class="strike">i am strike</p>
</body>

</html>
