<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
    </style>
</head>
<style>
    /* ancestor combinator */
    .c1 .c2 {
        color: blue;
    }

    /* s */
    /* parent combinator  */
    .c1>div>div>span>.c2 {
        background-color: lightgreen;
    }
</style>

<body>
    <!-- Select "I'm here. find me" and background-color: lightgreen -->
    <div class="c1">
        <div>
            <div>
                <span>
                    <div class="c2">I'm here. find me</div>
                </span>
            </div>
        </div>
        <span>
            <div class="c2">Dont select me</div>
        </span>
    </div>

</body>

</html>
