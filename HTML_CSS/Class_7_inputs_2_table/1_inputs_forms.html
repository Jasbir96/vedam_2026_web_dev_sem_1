<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<!-- 

-->

<body>

    <h1>Registration Form</h1>

    <form>
        <div>
            <label for="first-name">First Name: </label>
            <input type="text" id="first-name" placeholder="your first name" >
        </div>

        <div>
            <label for="last-name">Last Name: </label>
            <input type="text" id="last-name" placeholder="your last name" required>
        </div>

        <div>
            <label for="campus">Campus: </label>
            <input type="text" id="campus" readonly value="Sushant University">
        </div>

        <div>
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="you@email" required>
        </div>

        <div>
            <label for="password">Password: </label>
            <input type="password" id="password" placeholder="******" required minlength="6">
        </div>

        <div>
            <label for="gender">Gender: </label>
            <select id="gender" required>
                <option value="">-- Select --</option>
                <option value="male">M</option>
                <option value="female">F</option>
                <option value="other">O</option>
            </select>
        </div>

        <div>
            <label for="mobile">Mobile: </label>
            <input type="number" id="mobile" placeholder="10-digit number" min="100000000" max="999999999" required>
        </div>

        <!--Age: number with validation range
DOB 
Profile Pic
forms and submit
-->
        <div>
            <label for="age">Age </label>
            <input type="number" id="age" placeholder="enter your age" min="0" required step="2">
        </div>
        <div>
            <label for="DOB">DOB </label>
            <input type="date" id="DOB" required>
        </div>
        <br>
        <div>
            <label for="Profile_pic">Profile Pic </label>
            <input type="file" id="Profile_pic" required>
        </div>
        <div>
            <!-- <input type="submit"></input> -->
            <button type="submit">Register</button>
        </div>
    </form>
<!-- 
    1. comment box 
    2. MCQ 
    3. where you have multiple selection 
    4. rest Button
  -->

</body>

</html>
