<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creator</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .input-area input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #addBtn {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        #addBtn:hover {
            background-color: #2980b9;
        }

        .question-card {
            background: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .question-card h3 {
            margin: 0 0 8px;
        }

        .question-card ul {
            margin: 0 0 8px;
            padding-left: 20px;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <h1>📝 New Quiz Creator</h1>
    <div class="input-area">
        <input id="questionInput" type="text" placeholder="Enter question">
        <input id="optionA" type="text" placeholder="Option A">
        <input id="optionB" type="text" placeholder="Option B">
        <input id="optionC" type="text" placeholder="Option C">
        <input id="optionD" type="text" placeholder="Option D">
        <button id="addBtn">Add Question</button>
    </div>

    <div id="quizList">
    </div>
    <!--  
    Requirements
    * when i click  -> 
        * we have to do validation
        * question gets added
        * input becomes empty
    -->
    <!-- 
1. when i click     
-->
    <script>
        let addBtn = document.querySelector("#addBtn");
        // fetch the elements
        let questionInput = document.querySelector("#questionInput")
        let optionA = document.querySelector("#optionA")
        let optionB = document.querySelector("#optionB")
        let optionC = document.querySelector("#optionC")
        let optionD = document.querySelector("#optionD");
        // find the parent element

        let quizList = document.querySelector("#quizList");

        addBtn.addEventListener("click", function () {
            // we have to do add validation-> of non empty
            // fetch there values
            let questionValue = questionInput.value;
            let optionAValue = optionA.value;
            let optionBValue = optionB.value;
            let optionCValue = optionC.value;
            let optionDValue = optionD.value;
            //values should not be empty
            let isNotEmpty = questionValue != "" && optionAValue != "" &&
                optionBValue != "" &&
                optionCValue != "" &&
                optionDValue != ""
            if (isNotEmpty) {
                //  question gets added
                // alert("creating question");
                let questionCard = document.createElement("div");
                let innerElements = `<h3>${questionValue}</h3>
                    <ul>
                        <li>A. ${optionAValue}</li>
                        <li>B. ${optionBValue}</li>
                        <li>C. ${optionCValue}</li>
                        <li>D. ${optionDValue}</li>
                    </ul><button class="delete-btn">Delete</button>`;
                // append 
                questionCard.innerHTML = innerElements;
                questionCard.className = "question-card";
                quizList.appendChild(questionCard);
                //clear input
                questionInput.value="";
                optionA.value = "";
                optionB.value = "";
                optionC.value = "";
                optionD.value = "";

                // delete 
                let deleteBtn = questionCard.querySelector("button");
                deleteBtn.addEventListener("click", function () {
                    questionCard.remove();
                })






            } else {
                alert("one of the filed is empty");
            }
        })
    </script>
</body>

</html>
