<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body{
        font-size: 30px;
    }
    /* universal selector */
    * {
    font-size: 35px;
       
    }

    /* element selector */
    div {
        font-size: 10px ;
    }

    /* class */
    .child {
        font-size: 15px;
      
    }

    div.child {
       font-size: 12px;
    }

    #unique {
        font-size: 18px;
    }
</style>

<body>

    <div class="child" id="unique" style="font-size: 10px;" >Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ut
        explicabo corrupti,
        asperiores natus quia nostrum! Tempora, asperiores, minus enim vel, nemo doloribus sed ad aliquid quia
        quo quidem doloremque consequuntur.</div>
    </div>

    <div class="parent">
        <a href="">I am something</a>

    </div>


</body>

</html>


<!-- important > inline > id >class> element> universal > useragent>inherited value -->
